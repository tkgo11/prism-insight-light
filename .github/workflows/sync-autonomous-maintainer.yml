name: Sync autonomous-maintainer skill

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: autonomous-maintainer-skill-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'tkgo11/prism-insight-light'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PRISM
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true

      - name: Fetch maintained skill (data only; do not run its scripts)
        id: upstream
        shell: bash
        run: |
          git clone --depth=1 --branch main https://github.com/tkgo11/autonomous-maintainer.git "$RUNNER_TEMP/autonomous-maintainer"
          sha="$(git -C "$RUNNER_TEMP/autonomous-maintainer" rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          python3 scripts/sync_autonomous_maintainer.py \
            --source "$RUNNER_TEMP/autonomous-maintainer" --revision "$sha"
          python3 scripts/sync_autonomous_maintainer.py --verify-installed
          python3 tests/test_autonomous_maintainer_sync.py -q

      - name: Create scoped skill update pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          set -euo pipefail
          git add -A -- \
            .agents/skills/autonomous-maintainer \
            .agents/skills/autonomous-maintainer-standalone \
            .agents/skills/.autonomous-maintainer-source.json
          if git diff --cached --quiet; then
            echo "Skill snapshot already matches upstream; nothing to update."
            exit 0
          fi
          git diff --cached --check
          branch="automation/autonomous-maintainer-${UPSTREAM_SHA:0:12}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "::notice::An update branch already exists for $UPSTREAM_SHA; refusing to force-push."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -m "chore(skills): sync autonomous-maintainer ${UPSTREAM_SHA:0:12}"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create \
            --base main --head "$branch" \
            --title "chore(skills): sync autonomous-maintainer ${UPSTREAM_SHA:0:12}" \
            --body "Automated synchronization of the six Codex skill resources from \`tkgo11/autonomous-maintainer\` at \`$UPSTREAM_SHA\`. The source checksums, installed snapshot, and updater regression suite passed. No trading runtime files are updated. Review and CI are required before merging; this workflow never auto-merges."
